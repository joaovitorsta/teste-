<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 Telemetry Hub - Spa-Francorchamps</title>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #121722;
            --bg-header: #171f2e;
            --accent-red: #e10600;
            --accent-cyan: #00d2ff;
            --accent-yellow: #ffcb00;
            --accent-green: #00ff66;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #8e99ac;
            --border-color: #1e283a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER & NAVBAR */
        header {
            background: linear-gradient(90deg, #151b28 0%, #0d111a 100%);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .f1-logo {
            background-color: var(--accent-red);
            color: #fff;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 15px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 10px rgba(225, 6, 0, 0.5);
        }

        h1 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        select, input, button {
            background-color: #1a2233;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            border-color: #3b4861;
        }

        button {
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: var(--accent-red);
            border: none;
            box-shadow: 0 0 10px rgba(225, 6, 0, 0.3);
        }
        .btn-primary:hover { background-color: #b50500; }

        .btn-secondary {
            background-color: #26334d;
            border: none;
        }
        .btn-secondary:hover { background-color: #324366; }

        .status-pill {
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background-color: #1b4332;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .status-pill.yellow { background-color: #4a3b00; color: #ffcc00; border-color: #ffcc00; }
        .status-pill.vsc { background-color: #4a2800; color: #ff9900; border-color: #ff9900; }
        .status-pill.sc { background-color: #4a0000; color: #ff3333; border-color: #ff3333; }

        /* MAIN CONTENT LAYOUT */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 58px);
        }

        /* TRACK VIEW AREA */
        .track-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 40% 40%, #151d2c 0%, #090c12 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid var(--border-color);
        }

        svg#spa-svg {
            width: 98%;
            height: 98%;
        }

        /* SVG Track Elements */
        .track-bg-line { fill: none; stroke: #121824; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
        .track-base { fill: none; stroke: #1a2333; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Sectors */
        .sector-1 { fill: none; stroke: var(--accent-red); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
        .sector-2 { fill: none; stroke: var(--accent-cyan); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
        .sector-3 { fill: none; stroke: var(--accent-yellow); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
        
        /* DRS Zones */
        .drs-zone { fill: none; stroke: var(--accent-green); stroke-width: 3; stroke-dasharray: 6 6; }
        
        /* Turn Badges & Labels */
        .turn-badge { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
        .turn-text { font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
        
        /* Info Callout Badges */
        .callout-box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 4; }
        .callout-green { fill: var(--accent-green); font-size: 10px; font-weight: 900; }
        .callout-pink { fill: var(--accent-pink); font-size: 10px; font-weight: 900; }
        .callout-text { fill: #ffffff; font-size: 10px; font-weight: 800; text-anchor: middle; }

        /* Cars */
        .driver-node { cursor: pointer; transition: transform 0.05s linear; }
        .driver-node circle { stroke: #ffffff; stroke-width: 2px; }
        .driver-node text { font-size: 10px; font-weight: 900; fill: #fff; text-anchor: middle; dominant-baseline: central; text-shadow: 0 0 3px #000; }

        /* SIDEBAR (TIMING TOWER & TELEMETRY) */
        .sidebar {
            width: 480px;
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .tab-menu {
            display: flex;
            background-color: #0e121a;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            border-bottom: 2px solid transparent;
            border-radius: 0;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: var(--accent-red);
            background-color: #141a26;
        }

        .leaderboard-header {
            padding: 8px 12px;
            background-color: #141a26;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-list {
            flex: 1;
            overflow-y: auto;
        }

        .driver-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid #18202e;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .driver-row:hover { background-color: #1a2334; }
        .driver-row.selected { background-color: #212c42; border-left: 3px solid var(--accent-red); }
        .driver-row.dnf { opacity: 0.35; background-color: rgba(255, 0, 0, 0.05); }

        .pos-col { width: 22px; font-weight: 800; color: var(--text-muted); }
        .team-strip { width: 4px; height: 16px; border-radius: 2px; margin-right: 8px; }
        .code-col { width: 40px; font-weight: 900; letter-spacing: 0.5px; }
        .name-col { flex: 1; color: #d0d7de; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tyre-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            margin-right: 8px;
        }
        .tyre-S { background: #e10600; color: #fff; }
        .tyre-M { background: #ffd700; color: #000; }
        .tyre-H { background: #ffffff; color: #000; }
        .tyre-I { background: #00ff66; color: #000; }

        .gap-col, .int-col { width: 58px; text-align: right; font-family: monospace; font-weight: 700; color: var(--text-muted); }
        .status-col { width: 45px; text-align: right; font-size: 10px; font-weight: 800; }

        /* TELEMETRY INSPECTOR PANEL */
        .telemetry-card {
            padding: 14px;
            background-color: #101520;
            border-top: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .telemetry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .telemetry-driver-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .driver-num-badge {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-red);
            font-family: monospace;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .tele-box {
            background-color: #161d2b;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1e283a;
            text-align: center;
        }

        .tele-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .tele-value { font-size: 16px; font-weight: 900; font-family: monospace; color: #fff; margin-top: 2px; }

        .gauge-bar {
            height: 6px;
            background-color: #222b3d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .gauge-fill { height: 100%; background-color: var(--accent-green); width: 0%; transition: width 0.1s; }

        .sector-pills {
            display: flex;
            gap: 6px;
        }

        .sec-pill {
            flex: 1;
            background-color: #161d2b;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 11px;
            font-weight: 800;
        }
        .sec-pill.purple { color: #d633ff; border: 1px solid #d633ff; }
        .sec-pill.green { color: #00ff66; border: 1px solid #00ff66; }
        .sec-pill.yellow { color: #ffcc00; }

        /* COMMENTARY / RACE FEED */
        .feed-section {
            height: 160px;
            background-color: #0c0f17;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 6px 12px;
            background-color: #121722;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .feed-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
        }

        .feed-item {
            padding: 5px 8px;
            border-radius: 4px;
            background-color: #141a26;
            border-left: 3px solid #3b4861;
            line-height: 1.3;
        }
        .feed-item.overtake { border-left-color: var(--accent-green); }
        .feed-item.pit { border-left-color: var(--accent-yellow); }
        .feed-item.sc { border-left-color: var(--accent-red); background: rgba(225, 6, 0, 0.1); }

        /* MODAL QUALI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background-color: #121722;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 520px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 14px;
            background-color: #171f2e;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .quali-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #1a2333;
            font-size: 12px;
        }
        .quali-row.pole { background: rgba(255, 203, 0, 0.1); border-left: 3px solid var(--accent-yellow); }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <span class="f1-logo">F1 2026</span>
            <h1>GP de Spa-Francorchamps</h1>
        </div>
        
        <div class="controls-bar">
            <div class="control-item">
                <label>Voltas:</label>
                <input type="number" id="laps-input" min="1" max="70" value="15" style="width: 50px;">
            </div>

            <div class="control-item">
                <label>Velocidade:</label>
                <select id="speed-select">
                    <option value="1" selected>1x (Real - 1m37s)</option>
                    <option value="2">2x Speed</option>
                    <option value="4">4x Speed</option>
                    <option value="8">8x Speed</option>
                </select>
            </div>

            <div class="control-item">
                <label>Clima:</label>
                <select id="weather-select">
                    <option value="DRY">☀️ Seco</option>
                    <option value="WET">🌧️ Chuva</option>
                </select>
            </div>

            <button class="btn-secondary" id="btn-quali">⚡ Executar Quali</button>
            <button class="btn-primary" id="btn-start">▶ Iniciar Corrida</button>
            <button class="btn-secondary" id="btn-reset">🔄 Resetar</button>

            <div id="status-pill" class="status-pill">Pista Livre</div>
        </div>
    </header>

    <div class="main-layout">
        <div class="track-container">
            <svg id="spa-svg" viewBox="0 0 1000 620">
                <path class="track-bg-line" id="track-bg" d="" />
                <path class="track-base" id="track-base" d="" />

                <path class="sector-1" id="path-sec1" d="" />
                <path class="sector-2" id="path-sec2" d="" />
                <path class="sector-3" id="path-sec3" d="" />

                <path class="drs-zone" id="drs-zone-1" d="" />
                <path class="drs-zone" id="drs-zone-2" d="" />

                <g id="turns-layer"></g>

                <g transform="translate(140, 390)">
                    <rect class="callout-box" x="0" y="0" width="130" height="22" />
                    <rect x="0" y="0" width="4" height="22" class="callout-green" />
                    <text class="callout-text" x="67" y="14">DRS DETECTION ZONE 1</text>
                    <line x1="130" y1="11" x2="160" y2="25" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="2 2" />
                </g>

                <g transform="translate(370, 160)">
                    <rect class="callout-box" x="0" y="0" width="85" height="22" />
                    <rect x="0" y="0" width="4" height="22" class="callout-pink" />
                    <text class="callout-text" x="44" y="14">SPEED TRAP</text>
                    <line x1="42" y1="22" x2="42" y2="38" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="2 2" />
                </g>

                <g transform="translate(370, 470)">
                    <rect class="callout-box" x="0" y="0" width="130" height="22" />
                    <rect x="0" y="0" width="4" height="22" class="callout-green" />
                    <text class="callout-text" x="67" y="14">DRS DETECTION ZONE 2</text>
                    <line x1="0" y1="11" x2="-30" y2="-15" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="2 2" />
                </g>

                <g id="start-finish-group">
                    <line x1="235" y1="465" x2="245" y2="495" stroke="#ffffff" stroke-width="4" />
                    <text x="215" y="460" font-size="14">🏁</text>
                </g>

                <g id="drivers-layer"></g>
            </svg>
        </div>

        <div class="sidebar">
            <div class="tab-menu">
                <button class="tab-btn active">Classificação em Tempo Real</button>
            </div>

            <div class="leaderboard-header">
                <span style="width: 22px;">POS</span>
                <span style="flex:1; margin-left: 12px;">PILOTO</span>
                <span style="width: 26px;">PNEU</span>
                <span style="width: 58px; text-align: right;">GAP</span>
                <span style="width: 58px; text-align: right;">INT</span>
                <span style="width: 45px; text-align: right;">ST</span>
            </div>

            <div class="leaderboard-list" id="leaderboard"></div>

            <div class="telemetry-card" id="telemetry-card">
                <div class="telemetry-header">
                    <div class="telemetry-driver-info">
                        <span class="driver-num-badge" id="tele-num">#1</span>
                        <div>
                            <div style="font-weight: 900; font-size: 14px;" id="tele-name">Max Verstappen</div>
                            <div style="font-size: 11px; color: var(--text-muted);" id="tele-team">Red Bull Racing</div>
                        </div>
                    </div>
                    <div class="tyre-badge tyre-S" id="tele-tyre">S</div>
                </div>

                <div class="telemetry-grid">
                    <div class="tele-box">
                        <div class="tele-label">Velocidade</div>
                        <div class="tele-value" id="tele-speed">315 km/h</div>
                    </div>
                    <div class="tele-box">
                        <div class="tele-label">Marcha</div>
                        <div class="tele-value" id="tele-gear">7</div>
                    </div>
                    <div class="tele-box">
                        <div class="tele-label">DRS</div>
                        <div class="tele-value" id="tele-drs" style="color: var(--accent-green);">ATIVO</div>
                    </div>
                </div>

                <div>
                    <div class="tele-label" style="display: flex; justify-content: space-between;">
                        <span>Aceleração / Freio</span>
                        <span id="tele-wear">Pneus: 88%</span>
                    </div>
                    <div class="gauge-bar"><div class="gauge-fill" id="tele-throttle"></div></div>
                </div>

                <div class="sector-pills">
                    <div class="sec-pill purple" id="tele-s1">S1: 30.124</div>
                    <div class="sec-pill green" id="tele-s2">S2: 43.850</div>
                    <div class="sec-pill yellow" id="tele-s3">S3: 23.026</div>
                </div>
            </div>

            <div class="feed-section">
                <div class="feed-header">Telemetria & Eventos da Prova</div>
                <div class="feed-list" id="feed-list"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="quali-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="text-transform: uppercase; font-size: 14px;">Resultado do Quali (Q3 Final)</h3>
                <button class="btn-primary" id="btn-close-modal">Aplicar Grid</button>
            </div>
            <div class="modal-body" id="quali-results-list"></div>
        </div>
    </div>

    <script>
        // CONTROL POINTS AUTÊNTICOS DO CIRCUITO DE SPA-FRANCORCHAMPS
        const spaControlPoints = [
            { x: 240, y: 480, turn: null },       // Start/Finish
            { x: 110, y: 525, turn: "01" },       // T1 - La Source
            { x: 155, y: 465, turn: null },
            { x: 210, y: 415, turn: "02" },       // T2 - Eau Rouge
            { x: 270, y: 325, turn: "03" },       // T3
            { x: 340, y: 245, turn: "04" },       // T4 - Raidillon
            { x: 430, y: 185, turn: null },       // Speed Trap
            { x: 540, y: 130, turn: null },       // Kemmel Straight
            { x: 650, y: 75,  turn: null },
            { x: 710, y: 55,  turn: "05" },       // T5 - Les Combes
            { x: 740, y: 60,  turn: "06" },       // T6
            { x: 770, y: 80,  turn: "07" },       // T7 - Malmedy
            { x: 830, y: 115, turn: null },
            { x: 885, y: 170, turn: "08" },       // T8 - Bruxelles
            { x: 905, y: 230, turn: null },
            { x: 875, y: 280, turn: null },
            { x: 800, y: 240, turn: "09" },       // T9 - No Name
            { x: 730, y: 205, turn: null },
            { x: 650, y: 255, turn: "10" },       // T10 - Pouhon 1
            { x: 645, y: 335, turn: "11" },       // T11 - Pouhon 2
            { x: 685, y: 400, turn: null },
            { x: 760, y: 430, turn: "12" },       // T12 - Campus
            { x: 820, y: 465, turn: "13" },       // T13 - Stavelot 1
            { x: 865, y: 515, turn: "14" },       // T14 - Stavelot 2
            { x: 845, y: 560, turn: "15" },       // T15 - Curve 15
            { x: 770, y: 575, turn: null },
            { x: 660, y: 545, turn: null },
            { x: 540, y: 470, turn: "16" },       // T16 - Paul Frere
            { x: 430, y: 435, turn: "17" },       // T17 - Blanchimont
            { x: 340, y: 440, turn: null },
            { x: 290, y: 455, turn: "18" },       // T18 - Bus Stop 1
            { x: 275, y: 435, turn: null },
            { x: 260, y: 445, turn: "19" },       // T19 - Bus Stop 2
            { x: 250, y: 470, turn: null }
        ];

        // INTERPOLADOR CATMULL-ROM
        function generateCatmullRomSpline(pts, samplesPerSegment = 25) {
            const n = pts.length;
            let points = [];

            for (let i = 0; i < n; i++) {
                const p0 = pts[(i - 1 + n) % n];
                const p1 = pts[i];
                const p2 = pts[(i + 1) % n];
                const p3 = pts[(i + 2) % n];

                for (let tIdx = 0; tIdx < samplesPerSegment; tIdx++) {
                    const t = tIdx / samplesPerSegment;
                    const t2 = t * t;
                    const t3 = t2 * t;

                    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);

                    points.push({ x, y, turn: tIdx === 0 ? p1.turn : null });
                }
            }
            return points;
        }

        const trackPoints = generateCatmullRomSpline(spaControlPoints, 25);
        const totalPoints = trackPoints.length; // 850 Pontos

        // LIMITES DOS SETORES E DRS
        const S1_END = 225;
        const S2_END = 600;
        const DRS1_START = 125, DRS1_END = 220;
        const DRS2_START = 820, DRS2_END = 25;

        function buildSVGPath(startIdx, endIdx) {
            let d = "";
            for (let i = startIdx; i <= endIdx; i++) {
                const pt = trackPoints[i % totalPoints];
                d += (i === startIdx) ? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`;
            }
            return d;
        }

        // MONTA OS CAMINHOS DO SVG
        const fullPath = buildSVGPath(0, totalPoints - 1) + " Z";
        document.getElementById('track-bg').setAttribute('d', fullPath);
        document.getElementById('track-base').setAttribute('d', fullPath);

        document.getElementById('path-sec1').setAttribute('d', buildSVGPath(0, S1_END));
        document.getElementById('path-sec2').setAttribute('d', buildSVGPath(S1_END, S2_END));
        document.getElementById('path-sec3').setAttribute('d', buildSVGPath(S2_END, totalPoints - 1));

        document.getElementById('drs-zone-1').setAttribute('d', buildSVGPath(DRS1_START, DRS1_END));
        document.getElementById('drs-zone-2').setAttribute('d', buildSVGPath(DRS2_START, totalPoints - 1));

        // RENDERIZAR NÚMEROS DAS CURVAS NO MAPA
        const turnsLayer = document.getElementById('turns-layer');
        trackPoints.forEach(pt => {
            if (pt.turn) {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pt.x);
                circle.setAttribute('cy', pt.y);
                circle.setAttribute('r', '10');
                circle.setAttribute('class', 'turn-badge');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', pt.x);
                text.setAttribute('y', pt.y);
                text.setAttribute('class', 'turn-text');
                text.textContent = pt.turn;

                g.appendChild(circle);
                g.appendChild(text);
                turnsLayer.appendChild(g);
            }
        });

        // BASE DE DADOS OFICIAL DE PILOTOS F1 2026
        const grid2026 = [
            { id: 1, num: 1, name: "Max Verstappen", code: "VER", team: "Red Bull", color: "#3671C6", skill: 98, carPerf: 96 },
            { id: 2, num: 6, name: "Isack Hadjar", code: "HAD", team: "Red Bull", color: "#3671C6", skill: 84, carPerf: 96 },
            { id: 3, num: 4, name: "Lando Norris", code: "NOR", team: "McLaren", color: "#FF8000", skill: 95, carPerf: 98 },
            { id: 4, num: 81, name: "Oscar Piastri", code: "PIA", team: "McLaren", color: "#FF8000", skill: 93, carPerf: 98 },
            { id: 5, num: 63, name: "George Russell", code: "RUS", team: "Mercedes", color: "#6CD3BF", skill: 93, carPerf: 94 },
            { id: 6, num: 12, name: "Kimi Antonelli", code: "ANT", team: "Mercedes", color: "#6CD3BF", skill: 86, carPerf: 94 },
            { id: 7, num: 16, name: "Charles Leclerc", code: "LEC", team: "Ferrari", color: "#F80000", skill: 96, carPerf: 95 },
            { id: 8, num: 44, name: "Lewis Hamilton", code: "HAM", team: "Ferrari", color: "#F80000", skill: 97, carPerf: 95 },
            { id: 9, num: 14, name: "Fernando Alonso", code: "ALO", team: "Aston Martin", color: "#229971", skill: 94, carPerf: 88 },
            { id: 10, num: 18, name: "Lance Stroll", code: "STR", team: "Aston Martin", color: "#229971", skill: 80, carPerf: 88 },
            { id: 11, num: 10, name: "Pierre Gasly", code: "GAS", team: "Alpine", color: "#009325", skill: 87, carPerf: 83 },
            { id: 12, num: 43, name: "Franco Colapinto", code: "COL", team: "Alpine", color: "#009325", skill: 83, carPerf: 83 },
            { id: 13, num: 30, name: "Liam Lawson", code: "LAW", team: "Racing Bulls", color: "#6692FF", skill: 84, carPerf: 82 },
            { id: 14, num: 35, name: "Arvid Lindblad", code: "LIN", team: "Racing Bulls", color: "#6692FF", skill: 82, carPerf: 82 },
            { id: 15, num: 23, name: "Alexander Albon", code: "ALB", team: "Williams", color: "#64C4FF", skill: 88, carPerf: 85 },
            { id: 16, num: 55, name: "Carlos Sainz", code: "SAI", team: "Williams", color: "#64C4FF", skill: 91, carPerf: 85 },
            { id: 17, num: 31, name: "Esteban Ocon", code: "OCO", team: "Haas", color: "#B6BABD", skill: 86, carPerf: 81 },
            { id: 18, num: 87, name: "Oliver Bearman", code: "BEA", team: "Haas", color: "#B6BABD", skill: 80, carPerf: 81 },
            { id: 19, num: 5, name: "Gabriel Bortoleto", code: "BOR", team: "Audi", color: "#C00000", skill: 85, carPerf: 80 },
            { id: 20, num: 27, name: "Nico Hülkenberg", code: "HUL", team: "Audi", color: "#C00000", skill: 87, carPerf: 80 },
            { id: 21, num: 11, name: "Sergio Pérez", code: "PER", team: "Cadillac", color: "#FFD700", skill: 86, carPerf: 78 },
            { id: 22, num: 77, name: "Valtteri Bottas", code: "BOT", team: "Cadillac", color: "#FFD700", skill: 86, carPerf: 78 }
        ];

        let drivers = [];
        let selectedDriverId = 1;
        let simulationRunning = false;
        let totalLaps = 15;
        let simSpeed = 1;
        let trackStatus = "CLEAR";
        let statusTimer = 0;
        let raceFinished = false;
        let lastTime = 0;
        
        const BASE_LAP_TIME = 97.0; // Target: 1m37s por volta no 1x

        const driversLayer = document.getElementById('drivers-layer');
        const leaderboardEl = document.getElementById('leaderboard');
        const feedListEl = document.getElementById('feed-list');
        const statusPill = document.getElementById('status-pill');
        const btnStart = document.getElementById('btn-start');

        function initSimulation(customGridOrder = null) {
            driversLayer.innerHTML = '';
            leaderboardEl.innerHTML = '';
            feedListEl.innerHTML = '';
            
            totalLaps = parseInt(document.getElementById('laps-input').value) || 15;
            trackStatus = "CLEAR";
            updateStatusUI();
            raceFinished = false;

            const gridSource = customGridOrder || grid2026;

            drivers = gridSource.map((d, index) => {
                const gridOffset = index * 7;
                const initialProgress = (totalPoints - gridOffset + totalPoints) % totalPoints;

                // SVG Car Node
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'driver-node');
                g.setAttribute('id', `driver-node-${d.id}`);
                g.addEventListener('click', () => selectDriver(d.id));

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '7');
                circle.setAttribute('fill', d.color);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('dy', '1');
                text.textContent = d.code;

                g.appendChild(circle);
                g.appendChild(text);
                driversLayer.appendChild(g);

                const skillFactor = (d.skill * 0.4 + d.carPerf * 0.6) / 100;

                return {
                    ...d,
                    progress: initialProgress,
                    lap: 1,
                    distanceTotal: initialProgress,
                    speedFactor: 0.98 + (skillFactor * 0.04),
                    tire: 'S',
                    tireLife: 100,
                    isPit: false,
                    pitTimer: 0,
                    isDNF: false,
                    speedKmh: 0,
                    gear: 1,
                    drsActive: false,
                    s1: "--.--", s2: "--.--", s3: "--.--",
                    element: g
                };
            });

            updatePositions();
            renderLeaderboard();
            updateTelemetryCard();
            addFeedItem("Luzes apagadas em Spa-Francorchamps! Corrida iniciada.", "normal");
        }

        function selectDriver(id) {
            selectedDriverId = id;
            renderLeaderboard();
            updateTelemetryCard();
        }

        function updatePositions() {
            drivers.sort((a, b) => {
                if (a.isDNF && !b.isDNF) return 1;
                if (!a.isDNF && b.isDNF) return -1;
                return b.distanceTotal - a.distanceTotal;
            });
        }

        function renderLeaderboard() {
            leaderboardEl.innerHTML = '';
            const leaderDist = drivers[0].distanceTotal;

            drivers.forEach((d, idx) => {
                const row = document.createElement('div');
                row.className = `driver-row ${d.id === selectedDriverId ? 'selected' : ''} ${d.isDNF ? 'dnf' : ''}`;
                row.addEventListener('click', () => selectDriver(d.id));

                let gapText = "LÍDER";
                let intText = "—";

                if (idx > 0 && !d.isDNF) {
                    const ptsPerSec = totalPoints / BASE_LAP_TIME;
                    const gapSec = (leaderDist - d.distanceTotal) / ptsPerSec;
                    const intSec = (drivers[idx - 1].distanceTotal - d.distanceTotal) / ptsPerSec;
                    gapText = `+${gapSec.toFixed(1)}s`;
                    intText = `+${intSec.toFixed(1)}s`;
                }

                row.innerHTML = `
                    <div class="pos-col">${idx + 1}</div>
                    <div class="team-strip" style="background-color: ${d.color}"></div>
                    <div class="code-col">${d.code}</div>
                    <div class="name-col">${d.name}</div>
                    <div class="tyre-badge tyre-${d.tire}">${d.tire}</div>
                    <div class="gap-col">${d.isDNF ? 'DNF' : gapText}</div>
                    <div class="int-col">${d.isDNF ? '-' : intText}</div>
                    <div class="status-col">${d.isDNF ? 'OUT' : d.isPit ? 'PIT' : 'OK'}</div>
                `;
                leaderboardEl.appendChild(row);
            });
        }

        function updateTelemetryCard() {
            const d = drivers.find(drv => drv.id === selectedDriverId) || drivers[0];
            document.getElementById('tele-num').textContent = `#${d.num}`;
            document.getElementById('tele-num').style.color = d.color;
            document.getElementById('tele-name').textContent = d.name;
            document.getElementById('tele-team').textContent = `${d.team} Racing`;
            
            const tyreEl = document.getElementById('tele-tyre');
            tyreEl.textContent = d.tire;
            tyreEl.className = `tyre-badge tyre-${d.tire}`;

            document.getElementById('tele-speed').textContent = `${Math.round(d.speedKmh)} km/h`;
            document.getElementById('tele-gear').textContent = d.gear;
            
            const drsEl = document.getElementById('tele-drs');
            drsEl.textContent = d.drsActive ? "ATIVO" : "DESAT.";
            drsEl.style.color = d.drsActive ? "var(--accent-green)" : "var(--text-muted)";

            document.getElementById('tele-wear').textContent = `Pneus: ${Math.round(d.tireLife)}%`;
            document.getElementById('tele-throttle').style.width = `${Math.min(100, (d.speedKmh / 340) * 100)}%`;

            document.getElementById('tele-s1').textContent = `S1: ${d.s1}`;
            document.getElementById('tele-s2').textContent = `S2: ${d.s2}`;
            document.getElementById('tele-s3').textContent = `S3: ${d.s3}`;
        }

        function updateStatusUI() {
            statusPill.className = "status-pill";
            if (trackStatus === "CLEAR") {
                statusPill.textContent = "Pista Livre";
            } else if (trackStatus === "YELLOW") {
                statusPill.textContent = "Bandeira Amarela";
                statusPill.classList.add("yellow");
            } else if (trackStatus === "VSC") {
                statusPill.textContent = "Virtual Safety Car";
                statusPill.classList.add("vsc");
            } else if (trackStatus === "SC") {
                statusPill.textContent = "Safety Car";
                statusPill.classList.add("sc");
            }
        }

        function addFeedItem(text, type = "normal") {
            const item = document.createElement('div');
            item.className = `feed-item ${type}`;
            const leaderLap = drivers.length ? Math.max(...drivers.map(d => d.lap)) : 1;
            item.textContent = `[V${Math.min(leaderLap, totalLaps)}] ${text}`;
            feedListEl.insertBefore(item, feedListEl.firstChild);
        }

        // SIMULAÇÃO DE QUALIFYING (Q1, Q2, Q3)
        document.getElementById('btn-quali').addEventListener('click', () => {
            const results = grid2026.map(d => {
                const baseTime = 95.5; // ~1m35.5s
                const carBonus = (d.carPerf - 75) * 0.05;
                const driverBonus = (d.skill - 75) * 0.03;
                const randomVar = (Math.random() - 0.45) * 0.6;
                const bestLap = baseTime - carBonus - driverBonus + randomVar;
                return { ...d, lapTime: bestLap };
            });

            results.sort((a, b) => a.lapTime - b.lapTime);

            const listEl = document.getElementById('quali-results-list');
            listEl.innerHTML = '';

            const poleTime = results[0].lapTime;

            results.forEach((d, idx) => {
                const gap = idx === 0 ? "POLE" : `+${(d.lapTime - poleTime).toFixed(3)}s`;
                const mins = Math.floor(d.lapTime / 60);
                const secs = (d.lapTime % 60).toFixed(3);
                
                const row = document.createElement('div');
                row.className = `quali-row ${idx === 0 ? 'pole' : ''}`;
                row.innerHTML = `
                    <span style="width: 30px; font-weight: 800;">P${idx + 1}</span>
                    <span style="width: 4px; height: 16px; background: ${d.color}; margin-right: 10px; border-radius: 2px;"></span>
                    <span style="flex: 1; font-weight: 700;">${d.name} (${d.code})</span>
                    <span style="font-family: monospace; font-weight: 700; margin-right: 15px;">${mins}:${secs < 10 ? '0' : ''}${secs}</span>
                    <span style="font-family: monospace; color: var(--text-muted);">${gap}</span>
                `;
                listEl.appendChild(row);
            });

            document.getElementById('quali-modal').classList.add('active');

            // Salvar nova ordem do grid
            window.qualiGridOrder = results;
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            document.getElementById('quali-modal').classList.remove('active');
            if (window.qualiGridOrder) {
                initSimulation(window.qualiGridOrder);
                addFeedItem("Grid de largada atualizado com os resultados do Qualifying!", "normal");
            }
        });

        // LOOP PRINCIPAL DE CORRIDA E FÍSICA
        function raceLoop(timestamp) {
            if (!simulationRunning) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            simSpeed = parseFloat(document.getElementById('speed-select').value);
            const isWet = document.getElementById('weather-select').value === "WET";

            // Eventos aleatórios raros
            if (trackStatus === "CLEAR" && Math.random() < 0.00003) {
                const active = drivers.filter(d => !d.isDNF);
                if (active.length > 5) {
                    const victim = active[Math.floor(Math.random() * active.length)];
                    victim.isDNF = true;
                    trackStatus = "SC";
                    statusTimer = 20;
                    updateStatusUI();
                    addFeedItem(`INCIDENTE! ${victim.name} bateu em Blanchimont. Safety Car acionado!`, "sc");
                }
            }

            if (statusTimer > 0) {
                statusTimer -= deltaTime * simSpeed;
                if (statusTimer <= 0) {
                    trackStatus = "CLEAR";
                    updateStatusUI();
                    addFeedItem("Bandeira Verde! Safety Car retornou aos boxes.", "normal");
                }
            }

            const basePtsPerSec = totalPoints / BASE_LAP_TIME;

            drivers.forEach(d => {
                if (d.isDNF) return;

                if (d.isPit) {
                    d.pitTimer -= deltaTime * simSpeed;
                    if (d.pitTimer <= 0) {
                        d.isPit = false;
                        d.tireLife = 100;
                        d.tire = isWet ? 'I' : 'S';
                        addFeedItem(`${d.code} concluiu a troca de pneus nos boxes.`, "pit");
                    }
                    return;
                }

                // Cálculo da posição no traçado
                let factor = d.speedFactor;
                d.tireLife -= 0.03 * deltaTime * simSpeed;
                if (d.tireLife < 30) factor *= 0.94;
                if (isWet && d.tire !== 'I') factor *= 0.85;

                if (trackStatus === "SC") factor *= 0.45;
                if (trackStatus === "VSC") factor *= 0.65;

                // Pit stop automático
                if (d.tireLife < 20 && !d.isPit) {
                    d.isPit = true;
                    d.pitTimer = 22;
                }

                const step = basePtsPerSec * factor * deltaTime * simSpeed;
                d.progress += step;
                d.distanceTotal += step;

                // Verificação de DRS
                const currentIdx = Math.floor(d.progress) % totalPoints;
                d.drsActive = (currentIdx >= DRS1_START && currentIdx <= DRS1_END) || (currentIdx >= DRS2_START || currentIdx <= DRS2_END);

                // Velocidade em km/h e Marchas
                let baseKmh = 290;
                if ((currentIdx >= 50 && currentIdx <= 100) || (currentIdx >= 780 && currentIdx <= 820)) baseKmh = 90; // Curvas Lentas T1 e Bus Stop
                else if (d.drsActive) baseKmh = 340;
                
                d.speedKmh = baseKmh * factor;
                d.gear = Math.min(8, Math.max(1, Math.floor(d.speedKmh / 42)));

                // Atualizar voltas
                if (d.progress >= totalPoints) {
                    d.progress %= totalPoints;
                    d.lap++;

                    const lapSecs = BASE_LAP_TIME / factor;
                    d.s1 = (lapSecs * 0.31).toFixed(3);
                    d.s2 = (lapSecs * 0.45).toFixed(3);
                    d.s3 = (lapSecs * 0.24).toFixed(3);

                    if (d.lap > totalLaps) raceFinished = true;
                }

                // Renderizar Posições SVG
                const pt = trackPoints[Math.floor(d.progress) % totalPoints];
                if (pt) {
                    d.element.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);
                }
            });

            updatePositions();
            renderLeaderboard();
            updateTelemetryCard();

            if (raceFinished) {
                simulationRunning = false;
                btnStart.textContent = "Corrida Finalizada";
                btnStart.disabled = true;
                addFeedItem(`🏁 BANDEIRA A QUADROS! Vitória de ${drivers[0].name} em Spa-Francorchamps!`, "sc");
                return;
            }

            requestAnimationFrame(raceLoop);
        }

        // CONTROLES DE INTERAÇÃO
        btnStart.addEventListener('click', () => {
            if (raceFinished) return;
            simulationRunning = !simulationRunning;
            if (simulationRunning) {
                btnStart.textContent = "Pausar";
                btnStart.className = "btn-secondary";
                lastTime = performance.now();
                requestAnimationFrame(raceLoop);
            } else {
                btnStart.textContent = "Continuar Corrida";
                btnStart.className = "btn-primary";
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            simulationRunning = false;
            btnStart.textContent = "▶ Iniciar Corrida";
            btnStart.className = "btn-primary";
            btnStart.disabled = false;
            initSimulation();
        });

        // Inicializar simulador
        initSimulation();
    </script>
</body>
</html>
