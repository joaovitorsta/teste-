<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 Advanced Simulation - Spa-Francorchamps Engine V2</title>
    <style>
        :root {
            --bg-dark: #080a0f;
            --bg-panel: #0f1420;
            --bg-card: #151c2d;
            --bg-input: #1d263b;
            --accent-red: #ff1801;
            --accent-cyan: #00e5ff;
            --accent-yellow: #ffb700;
            --accent-green: #00ff66;
            --accent-purple: #d633ff;
            --text-main: #ffffff;
            --text-muted: #8292a8;
            --border-color: #222d44;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Titillium Web', 'Segoe UI', -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER CONTROL BAR */
        header {
            background: linear-gradient(180deg, #182030 0%, #0d121c 100%);
            padding: 8px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .f1-badge {
            background: var(--accent-red);
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            padding: 3px 10px;
            border-radius: 3px;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(255, 24, 1, 0.6);
        }

        .header-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #e2e8f0;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
        }

        select, input, button {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s ease;
        }

        select:hover, button:hover {
            border-color: #3d4f73;
            background: #25314c;
        }

        button {
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-red {
            background: var(--accent-red);
            border: none;
            box-shadow: 0 0 10px rgba(255, 24, 1, 0.4);
        }
        .btn-red:hover { background: #d01100; }

        .btn-blue {
            background: #233759;
            border: 1px solid #3d5885;
        }

        .flag-status {
            padding: 5px 12px;
            border-radius: 3px;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: #0f3822;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .flag-status.yellow { background: #3d3000; color: var(--accent-yellow); border-color: var(--accent-yellow); }
        .flag-status.sc { background: #400808; color: var(--accent-red); border-color: var(--accent-red); }

        /* WORKSPACE LAYOUT */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        .track-panel {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #111726 0%, #06080d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 2px solid var(--border-color);
        }

        svg#spa-circuit {
            width: 96%;
            height: 94%;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .track-layer-bg { fill: none; stroke: #0d121d; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
        .track-layer-asphalt { fill: none; stroke: #182030; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
        .track-pit-lane { fill: none; stroke: #ffb700; stroke-width: 4; stroke-dasharray: 4 4; opacity: 0.6; }

        .sector-s1 { fill: none; stroke: var(--accent-red); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .sector-s2 { fill: none; stroke: var(--accent-cyan); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .sector-s3 { fill: none; stroke: var(--accent-yellow); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

        .drs-line { fill: none; stroke: var(--accent-green); stroke-width: 3; stroke-dasharray: 6 6; }

        .turn-node { fill: #0d111a; stroke: #2a3752; stroke-width: 1.5; }
        .turn-label { font-size: 10px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }

        .map-badge-bg { fill: #111724; stroke: #26344e; stroke-width: 1; rx: 3; }
        .map-badge-text { fill: #ffffff; font-size: 9px; font-weight: 800; text-anchor: middle; }

        /* Car Elements */
        .car-group { cursor: pointer; transition: transform 0.03s linear; }
        .car-circle { stroke: #ffffff; stroke-width: 1.5px; }
        .car-tag { font-size: 9px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; text-shadow: 0 0 3px #000; }

        /* SIDEBAR (LEADERBOARD & TELEMETRY) */
        .sidebar {
            width: 500px;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .timing-header {
            padding: 8px 12px;
            background: #111724;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .timing-list {
            flex: 1;
            overflow-y: auto;
            max-height: 42vh;
        }

        .driver-card {
            display: flex;
            align-items: center;
            padding: 5px 12px;
            border-bottom: 1px solid #161e2e;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .driver-card:hover { background: #192235; }
        .driver-card.selected { background: #202c45; border-left: 3px solid var(--accent-red); }
        .driver-card.pit-status { background: rgba(255, 183, 0, 0.15); }
        .driver-card.dnf { opacity: 0.3; background: rgba(255, 0, 0, 0.05); }

        .pos-num { width: 22px; font-weight: 900; color: var(--text-muted); }
        .team-bar { width: 4px; height: 16px; border-radius: 2px; margin-right: 8px; }
        .driver-code { width: 38px; font-weight: 900; letter-spacing: 0.5px; }
        .driver-fullname { flex: 1; color: #cfd8e3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

        .tyre-pill {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            margin-right: 8px;
        }
        .tyre-S { background: var(--accent-red); color: #fff; }
        .tyre-M { background: var(--accent-yellow); color: #000; }
        .tyre-H { background: #ffffff; color: #000; }
        .tyre-I { background: var(--accent-green); color: #000; }

        .gap-time, .int-time { width: 55px; text-align: right; font-family: monospace; font-weight: 700; color: var(--text-muted); }

        /* TELEMETRY DASHBOARD */
        .telemetry-dashboard {
            background: #0b0e16;
            padding: 12px;
            border-top: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tele-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tele-driver-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tele-num { font-size: 22px; font-weight: 900; font-family: monospace; }
        .tele-name { font-size: 13px; font-weight: 800; text-transform: uppercase; }
        .tele-team { font-size: 10px; color: var(--text-muted); font-weight: 700; }

        .tele-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .stat-card {
            background: #131926;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #1c263b;
            text-align: center;
        }

        .stat-label { font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
        .stat-val { font-size: 14px; font-weight: 900; font-family: monospace; color: #fff; margin-top: 2px; }

        .canvas-container {
            height: 75px;
            background: #090c12;
            border: 1px solid #1c263b;
            border-radius: 4px;
            position: relative;
        }

        canvas#telemetry-chart {
            width: 100%;
            height: 100%;
        }

        .sector-times-row {
            display: flex;
            gap: 6px;
        }

        .sec-box {
            flex: 1;
            background: #131926;
            padding: 5px;
            border-radius: 3px;
            text-align: center;
            font-family: monospace;
            font-size: 11px;
            font-weight: 800;
        }
        .sec-box.purple { color: var(--accent-purple); border: 1px solid var(--accent-purple); }
        .sec-box.green { color: var(--accent-green); border: 1px solid var(--accent-green); }
        .sec-box.yellow { color: var(--accent-yellow); }

        /* LIVE FEED */
        .feed-container {
            flex: 1;
            background: #080a0f;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .feed-header {
            padding: 5px 12px;
            background: #111724;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .feed-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 11px;
        }

        .msg-item {
            padding: 4px 8px;
            border-radius: 3px;
            background: #131a27;
            border-left: 3px solid #2e3e5c;
            line-height: 1.3;
        }
        .msg-item.overtake { border-left-color: var(--accent-green); background: rgba(0, 255, 102, 0.08); }
        .msg-item.pit { border-left-color: var(--accent-yellow); background: rgba(255, 183, 0, 0.08); }
        .msg-item.sc { border-left-color: var(--accent-red); background: rgba(255, 24, 1, 0.1); }

        /* QUALIFYING MODAL */
        .modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 6, 10, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-mask.active { opacity: 1; pointer-events: auto; }

        .modal-dialog {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            width: 560px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .modal-header-bar {
            padding: 12px 16px;
            background: #141c2c;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body-list {
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .q-row {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            border-bottom: 1px solid #162033;
            font-size: 12px;
        }
        .q-row.p1 { background: rgba(255, 183, 0, 0.1); border-left: 3px solid var(--accent-yellow); }
        .q-row.eliminated { opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">

        </div>

            <button class="btn-blue" id="btn-sound-toggle">🔊 V6 Engine: ON</button>

            <button class="btn-red" id="btn-toggle-race">▶ Iniciar Corrida</button>

    <div class="workspace">
        <div class="track-panel">

                <path class="track-layer-asphalt" id="svg-main-track" d="" />
                <path class="track-pit-lane" id="svg-pit-lane" d="" />

                <path class="sector-s1" id="svg-sec1" d="" />
                <path class="sector-s2" id="svg-sec2" d="" />

                <path class="drs-line" id="svg-drs1" d="" />
                <path class="drs-line" id="svg-drs2" d="" />

                <g transform="translate(370, 155)">

                    <text class="map-badge-text" x="45" y="13" fill="#ff007f">SPEED TRAP</text>
                </g>

                <g transform="translate(230, 480)">
                    <rect class="map-badge-bg" x="0" y="0" width="75" height="18" />
                    <text class="map-badge-text" x="37" y="12" fill="#ffb700">PIT LANE</text>
                </g>

                <g id="start-line">
                    <line x1="235" y1="465" x2="245" y2="495" stroke="#ffffff" stroke-width="4" />
                    <text x="215" y="460" font-size="14">🏁</text>
                </g>

                <g id="layer-cars"></g>
            </svg>
        </div>

        <div class="sidebar">
            <div class="timing-header">
                <span style="width: 22px;">POS</span>
                <span style="flex:1; margin-left: 12px;">PILOTO</span>
                <span style="width: 25px;">PNEU</span>
                <span style="width: 55px; text-align: right;">GAP</span>
                <span style="width: 55px; text-align: right;">INT</span>
            </div>

            <div class="timing-list" id="ui-leaderboard"></div>

            <div class="telemetry-dashboard">
                <div class="tele-top-bar">
                    <div class="tele-driver-badge">
                        <span class="tele-num" id="tele-num" style="color: var(--accent-red);">#1</span>
                        <div>
                            <div class="tele-name" id="tele-name">Max Verstappen</div>
                            <div class="tele-team" id="tele-team">Red Bull Racing</div>
                        </div>
                    </div>

                </div>

                <div class="tele-stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Velocidade</div>

                    <div class="stat-card">

                    </div>

                        <div class="stat-label">Efeito ERS/DRS</div>

                    <canvas id="telemetry-chart"></canvas>

                </div>

            <div class="feed-container">

    <div class="modal-mask" id="modal-quali">
        <div class="modal-dialog">
            <div class="modal-header-bar">
                <h3 style="font-size: 13px; text-transform: uppercase;">Resultado do Qualifying (Q1 - Q3)</h3>
                <button class="btn-red" id="btn-close-modal">Aplicar ao Grid</button>
            </div>
            <div class="modal-body-list" id="ui-quali-list"></div>
        </div>
    </div>

    <script>
        // PONTOS DE CONTROLE DO CIRCUITO DE SPA-FRANCORCHAMPS
        const spaControlPoints = [
            { x: 240, y: 480, turn: null },       // Linha de Chegada
            { x: 110, y: 525, turn: "01" },       // T1 - La Source
            { x: 155, y: 465, turn: null },
            { x: 210, y: 415, turn: "02" },       // T2 - Eau Rouge
            { x: 270, y: 325, turn: "03" },       // T3
            { x: 340, y: 245, turn: "04" },       // T4 - Raidillon
            { x: 430, y: 185, turn: null },       
            { x: 540, y: 130, turn: null },       // Kemmel Straight
            { x: 650, y: 75,  turn: null },
            { x: 710, y: 55,  turn: "05" },       // T5 - Les Combes
            { x: 740, y: 60,  turn: "06" },       // T6
            { x: 770, y: 80,  turn: "07" },       // T7 - Malmedy
            { x: 830, y: 115, turn: null },
            { x: 885, y: 170, turn: "08" },       // T8 - Bruxelles
            { x: 905, y: 230, turn: null },
            { x: 875, y: 280, turn: null },
            { x: 800, y: 240, turn: "09" },       // T9
            { x: 730, y: 205, turn: null },
            { x: 650, y: 255, turn: "10" },       // T10 - Pouhon 1
            { x: 645, y: 335, turn: "11" },       // T11 - Pouhon 2
            { x: 685, y: 400, turn: null },
            { x: 760, y: 430, turn: "12" },       // T12 - Campus
            { x: 820, y: 465, turn: "13" },       // T13 - Stavelot
            { x: 865, y: 515, turn: "14" },       
            { x: 845, y: 560, turn: "15" },       
            { x: 770, y: 575, turn: null },
            { x: 660, y: 545, turn: null },
            { x: 540, y: 470, turn: "16" },       // T16 - Paul Frère
            { x: 430, y: 435, turn: "17" },       // T17 - Blanchimont
            { x: 340, y: 440, turn: null },
            { x: 290, y: 455, turn: "18" },       // T18 - Bus Stop 1
            { x: 275, y: 435, turn: null },
            { x: 260, y: 445, turn: "19" },       // T19 - Bus Stop 2
            { x: 250, y: 470, turn: null }
        ];

        function generateSpline(pts, samples = 25) {
            const n = pts.length;
            let res = [];
            for (let i = 0; i < n; i++) {
                const p0 = pts[(i - 1 + n) % n];
                const p1 = pts[i];
                const p2 = pts[(i + 1) % n];
                const p3 = pts[(i + 2) % n];

                for (let tIdx = 0; tIdx < samples; tIdx++) {
                    const t = tIdx / samples;
                    const t2 = t * t;
                    const t3 = t2 * t;

                    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.x) * t3);

                    res.push({ x, y, turn: tIdx === 0 ? p1.turn : null });
                }
            }
            return res;
        }

        const trackPoints = generateSpline(spaControlPoints, 25);
        const totalPoints = trackPoints.length; // 850 Pontos

        const S1_END = 225, S2_END = 600;
        const DRS1_START = 125, DRS1_END = 220;
        const DRS2_START = 820, DRS2_END = 30;
        const PIT_ENTRANCE = 790, PIT_EXIT = 60;

        function buildPath(start, end) {
            let d = "";
            for (let i = start; i <= end; i++) {
                const pt = trackPoints[i % totalPoints];
                d += (i === start) ? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`;
            }
            return d;
        }

        document.getElementById('svg-bg-track').setAttribute('d', buildPath(0, totalPoints - 1) + " Z");
        document.getElementById('svg-main-track').setAttribute('d', buildPath(0, totalPoints - 1) + " Z");
        document.getElementById('svg-sec1').setAttribute('d', buildPath(0, S1_END));
        document.getElementById('svg-sec2').setAttribute('d', buildPath(S1_END, S2_END));
        document.getElementById('svg-sec3').setAttribute('d', buildPath(S2_END, totalPoints - 1));
        document.getElementById('svg-drs1').setAttribute('d', buildPath(DRS1_START, DRS1_END));

        let audioCtx = null;

        let mainGain = null, filterNode = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Oscilador Principal V6 (Sawtooth para a explosão do cilindro)
                engineOsc1 = audioCtx.createOscillator();
                engineOsc1.type = 'sawtooth';

                // Oscilador Harmônico V6 (Pulse/Square para corpo do exaustor)
                engineOsc2 = audioCtx.createOscillator();
                engineOsc2.type = 'square';

                // Chiado MGU-K / Whine do Turbo (Sine Wave agudo)
                turboOsc = audioCtx.createOscillator();
                turboOsc.type = 'sine';

                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.setValueAtTime(1200, audioCtx.currentTime);

                mainGain = audioCtx.createGain();
                mainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

                const gainOsc2 = audioCtx.createGain();
                gainOsc2.gain.setValueAtTime(0.3, audioCtx.currentTime);

                const gainTurbo = audioCtx.createGain();
                gainTurbo.gain.setValueAtTime(0.12, audioCtx.currentTime);

                engineOsc1.connect(filterNode);
                engineOsc2.connect(gainOsc2);
                gainOsc2.connect(filterNode);
                turboOsc.connect(gainTurbo);
                gainTurbo.connect(mainGain);

                filterNode.connect(mainGain);
                mainGain.connect(audioCtx.destination);

                engineOsc1.start();
                engineOsc2.start();
                turboOsc.start();
            } catch (e) {
                console.log("Audio API não inicializada.");
            }
        }

        // CÁLCULO DE GEAR & RPM DE F1
        const gearSpeedLimits = [0, 80, 125, 170, 215, 260, 295, 330, 370];

        function getGearAndRPM(speedKmh) {
            let gear = 1;
            for (let g = 1; g <= 8; g++) {
                if (speedKmh <= gearSpeedLimits[g]) {
                    gear = g;
                    break;
                }
                gear = 8;
            }
            const minS = gearSpeedLimits[gear - 1];
            const maxS = gearSpeedLimits[gear];
            const ratio = Math.max(0, Math.min(1, (speedKmh - minS) / (maxS - minS || 1)));
            const rpm = 5500 + (ratio * 8500); // Faixa de 5.500 RPM a 14.000 RPM
            return { gear, rpm };
        }

        function updateEngineAudio(speedKmh) {
            if (!audioCtx || !audioEnabled) return;

            const { rpm } = getGearAndRPM(speedKmh);
            
            // Frequência Fundamental do V6 4-Tempos = (RPM / 60) * (6 / 2) = RPM / 20
            const baseFreq = Math.max(40, rpm / 20);
            
            engineOsc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.03);
            engineOsc2.frequency.setTargetAtTime(baseFreq * 0.5, audioCtx.currentTime, 0.03);
            turboOsc.frequency.setTargetAtTime(baseFreq * 4.5, audioCtx.currentTime, 0.05);

            filterNode.frequency.setTargetAtTime(Math.min(3500, baseFreq * 4), audioCtx.currentTime, 0.03);
        }

        function renderTelemetryCanvas(d) {
            const cvs = document.getElementById('telemetry-chart');
            const ctx = cvs.getContext('2d');
            cvs.width = cvs.clientWidth;
            cvs.height = cvs.clientHeight;

            ctx.clearRect(0, 0, cvs.width, cvs.height);

            if (!d.historySpeed || d.historySpeed.length < 2) return;

            ctx.beginPath();
            ctx.strokeStyle = d.color;
            ctx.lineWidth = 2;

            const step = cvs.width / 50;
            const data = d.historySpeed.slice(-50);

            data.forEach((val, i) => {
                const x = i * step;
                const y = cvs.height - ((val / 360) * cvs.height);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        // LOOP DE CORRIDA COM ULTRAPASSAGENS E PIT STOPS DINÂMICOS
        function raceLoop(timestamp) {
            if (!isRunning) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            simSpeed = parseFloat(document.getElementById('sel-speed').value);
            const isWet = document.getElementById('sel-weather').value === "WET";

            // Eventos de Safety Car
            if (trackFlag === "GREEN" && Math.random() < 0.00002) {
                const active = drivers.filter(d => !d.isDNF);
                if (active.length > 4) {
                    const victim = active[Math.floor(Math.random() * active.length)];
                    victim.isDNF = true;
                    trackFlag = "SC";
                    flagTimer = 16;
                    updateFlagUI();
                    addFeedMsg(`Bandeira Vermelha/SC! ${victim.name} escapou na Pouhon!`, "sc");
                }
            }

            if (flagTimer > 0) {
                flagTimer -= deltaTime * simSpeed;
                if (flagTimer <= 0) {
                    trackFlag = "GREEN";
                    updateFlagUI();
                    addFeedMsg("Pista Limpa! Safety Car recolhido.", "normal");
                }
            }

            const basePtsPerSec = totalPoints / BASE_LAP_TIME;

            // FÍSICA E MOVIMENTAÇÃO DE CADA CARRO
            drivers.forEach((d, rank) => {
                if (d.isDNF) return;

                const currentIdx = Math.floor(d.progress) % totalPoints;

                // Lógica de Pit Stop
                if (d.isPit) {
                    d.pitTimer -= deltaTime * simSpeed;
                    d.speedKmh = 80; // Limite de Pit Lane
                    if (d.pitTimer <= 0) {
                        d.isPit = false;
                        d.tireWear = 100;
                        d.tire = isWet ? 'I' : (Math.random() > 0.5 ? 'M' : 'H');
                        addFeedMsg(`PIT STOP COMPLETO: ${d.code} trocou pneus para [${d.tire}] em 2.4s!`, "pit");
                    }
                } else {
                    // Verificação de Entrada para o Box
                    if (d.tireWear < 28 && currentIdx >= PIT_ENTRANCE && currentIdx <= PIT_ENTRANCE + 35) {
                        d.isPit = true;
                        d.pitTimer = 6.5; // Duração do Pit Lane + Troca
                        addFeedMsg(`${d.code} entrou nos boxes (Pneus desgastados: ${Math.round(d.tireWear)}%).`, "pit");
                    }
                }

                // Cálculo do Fator de Velocidade
                let factor = d.baseSpeedFactor;
                d.tireWear -= 0.035 * deltaTime * simSpeed;
                
                if (d.tireWear < 30) factor *= 0.91;
                if (isWet && d.tire !== 'I') factor *= 0.82;
                if (trackFlag === "SC") factor *= 0.45;

                // DETECÇÃO DE VÁCUO (SLIPSTREAM) E ULTRAPASSAGEM
                d.slipstreamActive = false;
                if (rank > 0 && !d.isPit) {
                    const carAhead = drivers[rank - 1];
                    const distGap = carAhead.distanceTotal - d.distanceTotal;
                    
                    if (distGap > 0 && distGap < 22) { // Menos de ~0.8s atrás
                        d.slipstreamActive = true;
                        factor *= 1.12; // Bônus de 12% em velocidade pelo vácuo
                        
                        // Executar Ultrapassagem se for em reta e tiver maior fator
                        if (distGap < 4 && factor > carAhead.baseSpeedFactor) {
                            addFeedMsg(`ULTRAPASSAGEM! ${d.code} superou ${carAhead.code} na reta!`, "overtake");
                        }
                    }
                }

                // Zonas de DRS
                d.drsActive = (currentIdx >= DRS1_START && currentIdx <= DRS1_END) || (currentIdx >= DRS2_START || currentIdx <= DRS2_END);
                if (d.drsActive && !isWet) factor *= 1.08;

                // Perfil de Curvas x Retas de Spa
                let mapSpeed = 285;
                if ((currentIdx >= 40 && currentIdx <= 85) || (currentIdx >= 780 && currentIdx <= 820)) {
                    mapSpeed = 90; // La Source & Bus Stop
                } else if (currentIdx >= 140 && currentIdx <= 210) {
                    mapSpeed = 345; // Kemmel Straight
                }

                if (!d.isPit) {
                    d.speedKmh = mapSpeed * factor;
                }

                const gRpm = getGearAndRPM(d.speedKmh);
                d.gear = gRpm.gear;
                d.rpm = gRpm.rpm;

                // Avanço de Posição
                const step = basePtsPerSec * factor * deltaTime * simSpeed;
                d.progress += step;
                d.distanceTotal += step;

                // Histórico de Telemetria
                if (!d.historySpeed) d.historySpeed = [];
                d.historySpeed.push(d.speedKmh);
                if (d.historySpeed.length > 60) d.historySpeed.shift();

                // Completa Volta
                if (d.progress >= totalPoints) {
                    d.progress %= totalPoints;
                    d.lap++;

                    const lapSecs = BASE_LAP_TIME / factor;
                    d.s1 = (lapSecs * 0.31).toFixed(3);
                    d.s2 = (lapSecs * 0.45).toFixed(3);
                    d.s3 = (lapSecs * 0.24).toFixed(3);

                    if (d.lap > totalLaps) raceFinished = true;
                }

                // Renderizar Posição no SVG
                const pt = trackPoints[Math.floor(d.progress) % totalPoints];
                if (pt) {
                    d.element.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);
                }
            });

            updatePositions();
            renderLeaderboard();
            updateTelemetryUI();

            if (raceFinished) {
                isRunning = false;
                btnToggleRace.textContent = "Corrida Concluída";
                btnToggleRace.disabled = true;
                addFeedMsg(`🏁 BANDEIRA A QUADROS! Vitória de ${drivers[0].name} em Spa-Francorchamps!`, "sc");
                return;
            }

            requestAnimationFrame(raceLoop);
        }

        // EVENTOS DE CONTROLE
        btnToggleRace.addEventListener('click', () => {
            if (raceFinished) return;
            initAudio();
            isRunning = !isRunning;
            if (isRunning) {
                btnToggleRace.textContent = "Pausar";
                btnToggleRace.className = "btn-blue";
                lastTime = performance.now();
                requestAnimationFrame(raceLoop);
            } else {
                btnToggleRace.textContent = "Continuar Corrida";
                btnToggleRace.className = "btn-red";
            }
        });

        document.getElementById('btn-reset-all').addEventListener('click', () => {
            isRunning = false;
            btnToggleRace.textContent = "▶ Iniciar Corrida";
            btnToggleRace.className = "btn-red";
            btnToggleRace.disabled = false;
            initSimulation();
        });

        // Startup
        initSimulation();
    </script>
</body>
</html>
